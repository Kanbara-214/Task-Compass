# PostgreSQL を使いたい場合だけ、このファイルを
# config/application.properties としてコピーして使ってください。
TASK_COMPASS_DB_URL=jdbc:postgresql://localhost:5432/task_compass
TASK_COMPASS_DB_USERNAME=postgres
TASK_COMPASS_DB_PASSWORD=change-me

# デモ環境でサンプルデータを投入したい場合だけ true にしてください。
# 起動時に demo@example.com のタスクを作り直します。
task-compass.demo-seed.enabled=false
